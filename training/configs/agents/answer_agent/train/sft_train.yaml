model_name_or_path: meta-llama/Llama-3.1-8B-Instruct


### Method
stage: sft
do_train: true
do_eval: true
do_predict: false
finetuning_type: lora
quantization_bit: 4
quantization_type: nf4


### LoRA Config
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all


### Dataset
dataset_dir: ./training/data/formatted/sft
dataset: answer_train_sft
eval_dataset: answer_val_sft
template: llama3
cutoff_len: 1600


### Output
output_dir: ./training/outputs/adapters/sft/answer
logging_steps: 1
save_steps: 50
save_total_limit: 5
plot_loss: true
report_to: tensorboard


### Train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.5e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_steps: 50
resume_from_checkpoint: true
load_best_model_at_end: true
metric_for_best_model: eval_loss


# Eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50


# Mixed Precision
bf16: true