model_name_or_path: meta-llama/Llama-3.1-8B-Instruct


### Method
stage: dpo
do_train: true
do_eval: true
do_predict: false
finetuning_type: lora
quantization_bit: 4
quantization_type: nf4


### LoRA Config
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
adapter_name_or_path: ./training/outputs/adapters/sft/answer
create_new_adapter: true


### DPO Config
pref_beta: 0.1
pref_loss: sigmoid


### Dataset
dataset_dir: ./training/data/formatted/dpo
dataset: answer_train_dpo
eval_dataset: answer_val_dpo
template: llama3
cutoff_len: 4096


### Output
output_dir: ./training/outputs/adapters/dpo/answer
logging_steps: 1
save_steps: 50
save_total_limit: 5
plot_loss: true
report_to: tensorboard


### Train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_steps: 50


# Eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50


# Mixed Precision
bf16: true